name: wasmcart runtime

# Builds the cart runtime and publishes the three artifacts a game needs to be
# packed into a .wasc: the engine wasm, bob (the content compiler) and the
# builtins tree. wasmcart-defold-examples consumes these rather than rebuilding
# the engine, which keeps that repo's CI to a couple of minutes.
on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'scripts/**'
      - '.github/workflows/wasmcart-runtime.yml'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # CMakeLists.txt sets cmake_minimum_required(VERSION 4.0) and the build
      # uses the Ninja generator. Runners ship cmake 3.31, so both are
      # installed explicitly rather than assumed.
      - uses: lukka/get-cmake@v4.4.2
        with:
          cmakeVersion: '4.0.3'
          ninjaVersion: 'latest'

      # cmake's FindJava has to locate a JDK. Installing one explicitly keeps
      # this independent of whatever a particular developer's tree happens to
      # contain under tmp/.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # build.py shells out to `git remote get-url origin` and aborts without
      # one. actions/checkout leaves a remote in place, so this is a guard for
      # workflow_dispatch on a detached state rather than the normal path.
      - name: Ensure an origin remote exists
        run: git remote get-url origin || git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

      # build.py reads these from the environment and refuses to run without
      # them. `build.py shell` sets them by spawning an interactive shell, and
      # dmenv.sh is generated rather than committed, so neither is usable from
      # a workflow: set them directly instead.
      - name: Set the Defold build environment
        run: |
          {
            echo "DEFOLD_HOME=$GITHUB_WORKSPACE"
            echo "DYNAMO_HOME=$GITHUB_WORKSPACE/tmp/dynamo_home"
            echo "PYTHONPATH=$GITHUB_WORKSPACE/tmp/dynamo_home/lib/python:$GITHUB_WORKSPACE/build_tools:$GITHUB_WORKSPACE/tmp/dynamo_home/ext/lib/python"
            echo "PYTHONIOENCODING=UTF-8"
            echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/tmp/dynamo_home/lib/wasm-web:$GITHUB_WORKSPACE/tmp/dynamo_home/ext/lib/x86_64-linux"
            echo "CMAKE_GENERATOR=Ninja"
            echo "EM_CONFIG=$GITHUB_WORKSPACE/tmp/emscripten_config"
            echo "EM_CACHE=$GITHUB_WORKSPACE/tmp/emcache"
          } >> "$GITHUB_ENV"

      # Defold's own install_sdk pulls the Emscripten SDK from DM_PACKAGES_URL,
      # one of upstream's private secrets, which this org does not have. Clone
      # emsdk and install the version Defold expects instead.
      #
      # The whole SDK has to live at ext/SDKs/emsdk-<version>, not merely be on
      # PATH: build_tools/sdk.py reads <emsdk>/node to find the node it runs
      # emscripten with, so a config pointing elsewhere fails with
      # FileNotFoundError on that directory. A local checkout symlinks the same
      # path at its own emsdk clone.
      - name: Install the Emscripten SDK
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 4.0.6
          "$HOME/emsdk/emsdk" activate 4.0.6
          mkdir -p "$GITHUB_WORKSPACE/tmp/dynamo_home/ext/SDKs"
          ln -sfn "$HOME/emsdk" "$GITHUB_WORKSPACE/tmp/dynamo_home/ext/SDKs/emsdk-4.0.6"
          test -d "$HOME/emsdk/node" || { echo "::error::emsdk has no node/ directory; Defold needs it"; exit 1; }
          ls "$HOME/emsdk/node"

      - name: Write the Emscripten config Defold reads
        run: |
          set -euo pipefail
          mkdir -p tmp
          EM="$HOME/emsdk"
          NODE_BIN=$(ls -d "$EM"/node/*/bin/node | head -1)
          {
            echo "import os"
            echo "emsdk_path = '$EM'"
            echo "NODE_JS = '$NODE_BIN'"
            echo "LLVM_ROOT = emsdk_path + '/upstream/bin'"
            echo "BINARYEN_ROOT = emsdk_path + '/upstream'"
            echo "EMSCRIPTEN_ROOT = emsdk_path + '/upstream/emscripten'"
            echo "CACHE = '$GITHUB_WORKSPACE/tmp/emcache'"
          } > tmp/emscripten_config
          cat tmp/emscripten_config

      - name: Install external packages
        run: ./scripts/build.py --platform=wasm-web install_ext

      # install_ext unpacks the JDK and the toolchain binaries, so these can
      # only be resolved once it has run.
      - name: Add the installed toolchain to PATH
        run: |
          # JAVA_HOME comes from setup-java. Defold's own tree may also ship a
          # JDK under tmp/jdk on a developer machine; prefer that when present
          # so CI and a local checkout agree, but do not require it.
          JDK=$(ls -d "$GITHUB_WORKSPACE"/tmp/jdk/*/ 2>/dev/null | head -1)
          [ -n "$JDK" ] && echo "JAVA_HOME=${JDK%/}" >> "$GITHUB_ENV"
          {
            echo "$GITHUB_WORKSPACE/tmp/bin"
            [ -n "$JDK" ] && echo "${JDK%/}/bin"
            echo "$GITHUB_WORKSPACE/tmp/dynamo_home/bin/wasm-web"
            echo "$GITHUB_WORKSPACE/tmp/dynamo_home/bin"
            echo "$GITHUB_WORKSPACE/tmp/dynamo_home/ext/bin"
            echo "$GITHUB_WORKSPACE/tmp/dynamo_home/ext/bin/x86_64-linux"
          } >> "$GITHUB_PATH"

      - name: Build the cart runtime
        run: |
          ./scripts/build.py --platform=wasm-web --skip-tests build_engine -- \
            --skip-build-tests --with-wasmcart

      # build.py has exited 0 after a fatal compile error before now, leaving a
      # stale wasm in place. Assert the artifact exists and is plausibly sized
      # rather than trusting the exit code.
      - name: Verify the engine was actually produced
        run: |
          W=tmp/dynamo_home/bin/wasm-web/dmengine_wasmcart.wasm
          test -f "$W" || { echo "no engine at $W"; exit 1; }
          SZ=$(stat -c%s "$W")
          echo "engine: $SZ bytes"
          test "$SZ" -gt 1000000 || { echo "engine is implausibly small"; exit 1; }

      - name: Stage the toolchain
        run: |
          mkdir -p dist
          cp tmp/dynamo_home/bin/wasm-web/dmengine_wasmcart.wasm dist/
          cp tmp/dynamo_home/share/java/bob-light.jar dist/
          cp -a tmp/dynamo_home/content/builtins dist/builtins
          (cd dist && sha256sum dmengine_wasmcart.wasm bob-light.jar > SHA256SUMS)
          du -sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: wasmcart-defold-toolchain
          path: dist/
          retention-days: 30

      # On a tagged release, attach the toolchain so the examples repo can
      # fetch a stable version rather than the latest green build.
      - name: Attach to the release
        if: github.event_name == 'release'
        run: |
          tar czf wasmcart-defold-toolchain.tar.gz -C dist .
          gh release upload "${GITHUB_REF_NAME}" wasmcart-defold-toolchain.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
